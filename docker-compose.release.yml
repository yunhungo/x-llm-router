# Production deployment for Docker Compose V2 / QNAP Container Station.
# No .env file is required. PostgreSQL is the only persistent state.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xrouter
      POSTGRES_USER: xrouter
      POSTGRES_PASSWORD: xrouter
    volumes:
      - type: bind
        source: /share/Container/xrouter/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: true
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xrouter -d xrouter']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    image: mayflowerx/x-llm-router:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://xrouter:xrouter@db:5432/xrouter
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: change-me-now
      NODE_USE_ENV_PROXY: '1'
      HTTP_PROXY: ${XROUTER_HTTP_PROXY:-}
      HTTPS_PROXY: ${XROUTER_HTTPS_PROXY:-}
      NO_PROXY: ${XROUTER_NO_PROXY:-localhost,127.0.0.1,db}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '59051:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
