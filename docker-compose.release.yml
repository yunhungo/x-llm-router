# Generic deployment compose for Docker Compose V2.
# Copy .env.example to .env and replace every production secret before starting.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xrouter}
      POSTGRES_USER: ${POSTGRES_USER:-xrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-xrouter} -d ${POSTGRES_DB:-xrouter}']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  app:
    image: ${XROUTER_IMAGE:-mayflowerx/x-llm-router:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-xrouter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xrouter}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      CHATGPT_API_BASE: ${CHATGPT_API_BASE:-https://chatgpt.com/backend-api/codex}
      CHATGPT_AUTH_BASE: ${CHATGPT_AUTH_BASE:-https://auth.openai.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:4000'
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  postgres-data:
