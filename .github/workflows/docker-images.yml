name: Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build x-llm-router image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/x-llm-router
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=x-llm-router
          cache-to: type=gha,mode=max,scope=x-llm-router

      - name: Report runtime image layer delta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CURRENT_SHA: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME || github.repository_owner }}/x-llm-router
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          layer_budget_mib=5
          if [[ ! "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$PREVIOUS_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "${PREVIOUS_SHA}^{commit}" \
            || ! git diff --quiet "$PREVIOUS_SHA" "$CURRENT_SHA" -- \
              Dockerfile \
              package.json \
              pnpm-lock.yaml \
              pnpm-workspace.yaml \
              apps/api/package.json \
              apps/web/package.json \
              packages/contracts/package.json; then
            layer_budget_mib=75
          fi

          node scripts/report-image-layer-delta.mjs \
            "$IMAGE_REPOSITORY" \
            "sha-${CURRENT_SHA:0:7}" \
            "sha-${PREVIOUS_SHA:0:7}" \
            "$layer_budget_mib"
